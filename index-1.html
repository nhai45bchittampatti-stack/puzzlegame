<body>
<div id="start"><div class="card"><h1>🧩 SWAP PUZZLE</h1><p>Tap two pieces to swap them and complete the poster.</p><button onclick="startGame()">▶ TAP TO PLAY</button></div></div>
<div class="wrap">
<h1>🧩 SWAP PUZZLE</h1>
<div class="stats"><span>Moves: <b id="moves">0</b></span><span>Time: <b id="time">0</b>s</span></div>
<div id="board"></div>
<p class="small">Tap one piece, then tap another piece to swap.</p>
</div>
<div id="win"><div class="card"><h1>🎉 PUZZLE COMPLETE!</h1><p id="result"></p><button onclick="shareResult()">📤 SHARE RESULT</button><button onclick="newGame()">PLAY AGAIN</button></div></div>
<script>
let order=[], first=-1, moves=0, seconds=0, timer=null;
const board=document.getElementById('board');

function solved(){ return order.every((v,i)=>v===i); }

function shuffle(a){
  do {
    for(let i=a.length-1;i>0;i--){
      let j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
  } while(solved());
  return a;
}

function draw(){
  board.innerHTML='';
  order.forEach((piece,pos)=>{
    const t=document.createElement('div');
    t.className='tile';
    const r=Math.floor(piece/3), c=piece%3;
    t.style.backgroundPosition=(c*50)+'% '+(r*50)+'%';
    t.onclick=()=>tap(pos,t);
    board.appendChild(t);
  });
}

function tap(pos,t){
  if(first===-1){
    first=pos;
    t.classList.add('selected');
    return;
  }
  if(first===pos){
    first=-1;
    t.classList.remove('selected');
    return;
  }
  [order[first],order[pos]]=[order[pos],order[first]];
  moves++;
  first=-1;
  draw();
  document.getElementById('moves').textContent=moves;
  if(solved()){
    clearInterval(timer);
    document.getElementById('result').textContent=
      'Completed in '+moves+' moves and '+seconds+' seconds.';
    document.getElementById('win').style.display='flex';
  }
}

function shareResult(){
  const text='🎉 I solved the SWAP PUZZLE in '+moves+' moves and '+seconds+' seconds! 🧩';
  const url=window.location.href;
  if(navigator.share){
    navigator.share({title:'SWAP PUZZLE',text:text,url:url}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(text+'\n'+url).then(()=>alert('Result copied! Now you can paste it in WhatsApp, Facebook, Messenger, etc.'));
  }else{
    alert(text+'\n'+url);
  }
}

function startGame(){
  document.getElementById('start').style.display='none';
  newGame();
}

function newGame(){
  document.getElementById('win').style.display='none';
  order=[0,1,2,3,4,5,6,7,8];
  shuffle(order);
  moves=0; seconds=0; first=-1;
  document.getElementById('moves').textContent=0;
  document.getElementById('time').textContent=0;
  clearInterval(timer);
  timer=setInterval(()=>{
    seconds++;
    document.getElementById('time').textContent=seconds;
  },1000);
  draw();
}
</script>
</body>
