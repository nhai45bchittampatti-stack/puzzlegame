.tile.selected{outline:4px solid #ffd000;filter:brightness(1.35);transform:scale(.94);z-index:2}
.stats{text-align:center;color:#555;font-size:14px;margin-bottom:10px}
.controls{display:flex;justify-content:center;gap:10px;padding:0 15px 18px}
.ctrl{border:0;border-radius:12px;padding:11px 17px;font-weight:bold;cursor:pointer}
#shuffle{background:#111;color:#fff} #reset{background:#eee}

<body>
<div class="card">
<div class="header"><h1>🧩 Magic Swap Puzzle</h1><p class="sub">Tap two pieces to swap • படத்தை சரியாக அமைக்கவும்!</p></div>
<div id="board"></div>
<div class="stats">Moves: <b id="moves">0</b></div>
<div class="controls"><button class="ctrl" id="shuffle">🔀 Shuffle</button><button class="ctrl" id="reset">↻ Reset</button></div>
<div id="win">🎉 Puzzle Solved!<br><small>நன்றாக செய்தீர்கள்!</small></div>
</div>
<script>
const board=document.getElementById('board'),movesEl=document.getElementById('moves'),win=document.getElementById('win');
let order=[...Array(12).keys()],selected=null,moves=0;
function render(){
 board.innerHTML='';
 order.forEach((piece,pos)=>{
  const b=document.createElement('button');b.className='tile';
  const x=piece%4,y=Math.floor(piece/4);
  b.style.backgroundPosition=`${x*100/3}% ${y*100/2}%`;
  if(selected===pos)b.classList.add('selected');
  b.onclick=()=>tap(pos);board.appendChild(b);
 });
 movesEl.textContent=moves;
}
function tap(pos){
 if(selected===null)selected=pos;
 else if(selected===pos)selected=null;
 else{[order[selected],order[pos]]=[order[pos],order[selected]];moves++;selected=null;
 if(order.every((v,i)=>v===i))win.style.display='block';}
 render();
}
function shuffle(){
 do{for(let i=11;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
 while(order.every((v,i)=>v===i));
 moves=0;selected=null;win.style.display='none';render();
}
function reset(){order=[...Array(12).keys()];moves=0;selected=null;win.style.display='none';render()}
document.getElementById('shuffle').onclick=shuffle;
document.getElementById('reset').onclick=reset;shuffle();
</script>
</body>
